const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), el=i=>document.getElementById(i);
const kdb=()=>new Promise((ok,zle)=>{const r=indexedDB.open("dennik-kluc",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>ok(r.result);r.onerror=()=>zle(r.error)});

const kGet=()=>kOp("readonly",s=>s.get("k")), kPut=k=>kOp("readwrite",s=>s.put(k,"k")), kDel=()=>kOp("readwrite",s=>s.delete("k"));
async function spusti(k){const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(S.iv)},k,b(S.d));const s=document.createElement("script");s.textContent=new TextDecoder().decode(p);document.body.appendChild(s)}

async function odomkni(){const v=el("kod").value.trim();if(!v)return;el("kodChyba").textContent="Overujem…";let k;

    k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b(S.sol),iterations:S.it},z,{name:"AES-GCM",length:256},false,["decrypt"])}
